<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Read-Aloud Voices</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap">
<style>
  :root { --ink: #0d2f55; --muted: #5b6b7d; --line: #dbe3ec; --bg: #f4f7fb; --card: #fff; --go: #0f8a6a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 500 16px/1.5 'Plus Jakarta Sans', system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 60px; }
  h2 { font-size: 16px; margin: 28px 0 10px; color: var(--muted); }
  h1 { margin: 0 0 6px; font-size: 30px; font-weight: 800; }
  p.lede { margin: 0 0 18px; color: var(--muted); max-width: 62ch; }
  textarea { width: 100%; font: inherit; font-size: 17px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); resize: vertical; }
  .speed { display: flex; gap: 10px; align-items: center; margin: 10px 0 22px; font-weight: 700; color: var(--muted); font-size: 14px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  li { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  li.on { border-color: var(--go); box-shadow: 0 0 0 3px rgba(15,138,106,.15); }
  .name { flex: 1; min-width: 0; }
  .name b { display: block; font-size: 16px; }
  .name small { color: var(--muted); font-size: 13px; }
  .tag { font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: #e9f0f8; color: var(--ink); margin-left: 6px; }
  button { font: inherit; font-weight: 800; font-size: 14px; border-radius: 10px; padding: 9px 14px; cursor: pointer; border: 1.5px solid var(--line); background: #fff; color: var(--ink); }
  button.use { background: var(--ink); border-color: var(--ink); color: #fff; }
  li.on button.use { background: var(--go); border-color: var(--go); }
  button:focus-visible { outline: 3px solid #6aa7e8; outline-offset: 2px; }
  .empty { color: var(--muted); }
  .foot { margin-top: 22px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Read-aloud voices</h1>
  <p class="lede" id="lede">Press Play to hear each voice read the sentence below. "Use this voice" makes it the read-aloud voice in LoneStar.</p>
  <textarea id="say" rows="2">Write 2 to 4 sentences about your favorite day. Start with "One day."</textarea>
  <label class="speed">Speed <input id="rate" type="range" min="0.7" max="1.1" step="0.05" value="0.9"> <span id="rateVal">0.9</span></label>
  <ul id="list"><li class="empty">Loading voices…</li></ul>
  <h2 id="bh" hidden>Browser voices (used only when the Gemini voice is unavailable)</h2>
  <ul id="blist" hidden></ul>
  <p class="foot" id="foot"></p>
</main>
<script>
  const GEMINI = [['Sulafat', 'Warm'], ['Achird', 'Friendly'], ['Vindemiatrix', 'Gentle'], ['Leda', 'Youthful'], ['Aoede', 'Breezy'], ['Autonoe', 'Bright'], ['Puck', 'Upbeat'], ['Achernar', 'Soft']]
  const GKEY = 'lscr.gvoice', BKEY = 'lscr.voice'
  const API = location.port === '4200' ? 'http://localhost:8788' : ''
  const get = (k) => { try { return localStorage.getItem(k) } catch { return null } }
  const set = (k, v) => { try { localStorage.setItem(k, v) } catch {} }
  const rate = document.getElementById('rate')
  rate.oninput = () => { document.getElementById('rateVal').textContent = rate.value }
  const text = () => document.getElementById('say').value
  let player = null
  function row(name, sub, tag, on, onPlay, onUse) {
    const li = document.createElement('li')
    if (on) li.className = 'on'
    li.innerHTML = '<div class="name"><b></b><small></small></div><button class="play">▶ Play</button><button class="use"></button>'
    li.querySelector('b').textContent = name
    if (tag) li.querySelector('b').insertAdjacentHTML('beforeend', '<span class="tag"></span>'), li.querySelector('.tag').textContent = tag
    li.querySelector('small').textContent = sub
    li.querySelector('.play').onclick = (e) => onPlay(e.currentTarget)
    const use = li.querySelector('.use'); use.textContent = on ? '✓ In use' : 'Use this voice'; use.onclick = onUse
    return li
  }
  async function playGemini(voice, btn) {
    try { player?.pause() } catch {}
    btn.textContent = '… Loading'
    try {
      const r = await fetch(API + '/api/tts', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text: text(), voice }) })
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'failed')
      player = new Audio(URL.createObjectURL(await r.blob()))
      player.playbackRate = Number(rate.value) < 1 ? 0.92 : 1
      await player.play()
      btn.textContent = '▶ Play'
    } catch (e) { btn.textContent = '▶ Play'; document.getElementById('foot').textContent = 'Could not play: ' + e.message }
  }
  function renderGemini(defaultVoice) {
    const list = document.getElementById('list'); list.innerHTML = ''
    const pick = get(GKEY) || defaultVoice
    for (const [v, feel] of GEMINI) list.appendChild(row(v, feel + ' · Gemini', v === defaultVoice ? 'default' : '', v === pick,
      (btn) => playGemini(v, btn), () => { set(GKEY, v); renderGemini(defaultVoice) }))
  }
  /* browser voices: the fallback */
  const NOVELTY = /\b(albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|fred|junior|ralph|kathy|grandma|grandpa|rocko|eddy|flo|reed|sandy|shelley)\b/i
  function score(v) {
    const n = v.name || ''
    if (NOVELTY.test(n)) return -1
    let s = 0
    if (/natural/i.test(n)) s += 100
    else if (/online/i.test(n) && /microsoft/i.test(n)) s += 90
    else if (/^google/i.test(n)) s += 80
    else if (/premium/i.test(n)) s += 75
    else if (/enhanced|siri/i.test(n)) s += 65
    else if (/\b(ava|zoe|allison|susan|nathan|evan|tom|aria|jenny|guy|samantha)\b/i.test(n)) s += 20
    if (/\b(ava|aria|jenny|zoe|allison|samantha)\b/i.test(n)) s += 5
    if ((v.lang || '').replace('_', '-') === 'en-US') s += 10
    return s
  }
  function renderBrowser(target) {
    if (!('speechSynthesis' in window)) return
    const all = speechSynthesis.getVoices().filter((v) => /^en/i.test(v.lang) && score(v) >= 0).sort((a, b) => score(b) - score(a)).slice(0, 8)
    const list = document.getElementById(target); list.innerHTML = ''
    const pick = get(BKEY), active = all.find((v) => v.name === pick) || all[0]
    for (const v of all) list.appendChild(row(v.name, v.lang + ' · this computer', '', v === active,
      () => { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text()); u.voice = v; u.lang = v.lang; u.rate = Number(rate.value); speechSynthesis.speak(u) },
      () => { set(BKEY, v.name); renderBrowser(target) }))
  }
  fetch(API + '/api/health').then((r) => r.json()).catch(() => ({})).then((h) => {
    if (h.tts) {
      renderGemini(h.ttsVoice || 'Sulafat')
      document.getElementById('bh').hidden = false; document.getElementById('blist').hidden = false
      renderBrowser('blist'); speechSynthesis?.addEventListener?.('voiceschanged', () => renderBrowser('blist'))
    } else {
      document.getElementById('lede').textContent = h.ok
        ? 'The Gemini voice is not set up yet: add GEMINI_API_KEY to the .env file in the LoneStar folder, then restart the server. Until then, these are this computer\'s voices.'
        : 'This copy of LoneStar has no server (the GitHub demo), so it can only use this computer\'s voices.'
      renderBrowser('list'); speechSynthesis?.addEventListener?.('voiceschanged', () => renderBrowser('list'))
    }
  })
</script>
</body>
</html>
